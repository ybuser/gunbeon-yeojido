name: Browser flow checks
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  keyless-browser-flow:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx wrangler d1 migrations apply DB --local --config wrangler.local.jsonc
      - name: Exercise fallback, planning, briefing and group sharing flows
        env:
          QA_BROWSER_CHANNELS: chromium
          QA_CASES: small,desktop
          QA_LIVE: '0'
          QA_OUT_DIR: test-results/browser
        run: |
          node --input-type=module <<'JS'
          import { writeFileSync } from 'node:fs';
          import { randomBytes } from 'node:crypto';
          writeFileSync('.env.local', 'TEST_ACCESS_PASSWORD=1234\nTEST_SESSION_SECRET=' + randomBytes(32).toString('hex') + '\n');
          JS
          npm run dev > "$RUNNER_TEMP/gangwon-qa-server.log" 2>&1 &
          QA_SERVER_PID=$!
          trap 'kill "$QA_SERVER_PID" 2>/dev/null || true' EXIT
          node --input-type=module <<'JS'
          let ready=false;
          for(let i=0;i<60;i++) {
            try { const r=await fetch('http://localhost:3000/'); if(r.ok) {ready=true;break;} } catch {}
            await new Promise(resolve=>setTimeout(resolve,1000));
          }
          if(!ready) process.exit(1);
          JS
          QA_OUT_DIR=test-results/browser/accounts-api npm run test:accounts
          QA_OUT_DIR=test-results/browser/accounts-ui npm run test:accounts-ui
          QA_OUT_FILE=test-results/browser/groups-api.json npm run test:groups
          QA_OUT_DIR=test-results/browser/groups npm run test:groups-ui
          npm run test:browser
          QA_OUT_DIR=test-results/browser/guide npm run test:guide
          QA_OUT_DIR=test-results/browser/custom npm run test:custom
          QA_OUT_DIR=test-results/browser/outing npm run test:outing
          QA_OUT_DIR=test-results/browser/day npm run test:day
          QA_OUT_DIR=test-results/browser/advice-api npm run test:advice
          QA_OUT_DIR=test-results/browser/advice-ui npm run test:advice-ui
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-flow-evidence
          path: web/test-results/browser
          retention-days: 14
